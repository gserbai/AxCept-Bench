    <text x="1255" y="360" text-anchor="middle" fill="#eafff6" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700">Safe</text>
    <text x="1255" y="380" text-anchor="middle" fill="#eafff6" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700">approximation</text>
    <text x="1255" y="400" text-anchor="middle" fill="#eafff6" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" font-weight="700">region</text>
  </g>

  <!-- Memory trace statistics -->
  <g aria-label="Memory trace statistics">
    <rect x="258" y="457" width="212" height="98" rx="14" fill="#0a1626" stroke="#526985" stroke-width="2"/>
    <rect x="259" y="458" width="210" height="96" rx="13" fill="none" stroke="#ffba62" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.35;0.39;0.58;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(276 475)" fill="none" stroke="#b9c8da" stroke-width="1.7">
