    <rect x="1151" y="207" width="208" height="201" rx="16" fill="none" stroke="#77f1bd" stroke-width="3" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.12;1;0.35;0.12" keyTimes="0;0.67;0.76;0.9;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(1210 224) scale(0.9)" fill="none" stroke="#d7fff0" stroke-width="3">
