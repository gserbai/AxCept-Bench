    <text x="665" y="492" text-anchor="middle" fill="#eff4fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">Ramulator</text>
    <text x="665" y="529" text-anchor="middle" fill="#eff4fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">DRAMPower</text>
