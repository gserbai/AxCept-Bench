    </rect>
    <path d="M877 475L860 510H880L869 542L903 499H883L895 475Z" fill="#ffba62" filter="url(#cyanGlow)"/>
    <text x="961" y="494" text-anchor="middle" fill="#eff4fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Estimated</text>
    <text x="961" y="520" text-anchor="middle" fill="#eff4fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">energy</text>
  </g>

  <!-- Moving tokens that clarify sequence -->
  <g filter="url(#cyanGlow)">
    <circle r="5" fill="#2bd9ff" transform="translate(195 297)"><animateTransform attributeName="transform" type="translate" from="195 297" to="238 297" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2bd9ff" transform="translate(642 297)"><animateTransform attributeName="transform" type="translate" from="642 297" to="688 297" begin="-0.7s" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#8e81ff" transform="translate(834 270)"><animateTransform attributeName="transform" type="translate" from="834 270" to="875 270" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#8e81ff" transform="translate(834 337)"><animateTransform attributeName="transform" type="translate" from="834 337" to="875 337" begin="-0.9s" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#4be0a7" transform="translate(1120 253)"><animateTransform attributeName="transform" type="translate" from="1120 253" to="1150 253" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#4be0a7" transform="translate(1120 342)"><animateTransform attributeName="transform" type="translate" from="1120 342" to="1150 342" begin="-0.8s" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="700" y="596" text-anchor="middle" fill="#91a5be" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">Overview of the AxCept-Bench evaluation pipeline</text>
</svg>
