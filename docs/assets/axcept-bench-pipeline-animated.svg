    <rect x="505" y="457" width="302" height="98" rx="14" fill="#0a1626" stroke="#526985" stroke-width="2"/>
    <rect x="506" y="458" width="300" height="96" rx="13" fill="none" stroke="#ffba62" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.46;0.5;0.7;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(529 474)" fill="none" stroke="#ffca7c" stroke-width="1.5">
      <rect width="42" height="25" rx="4"/><path d="M7 6V19M14 6V19M21 6V19M28 6V19M35 6V19"/>
      <rect y="39" width="42" height="25" rx="4"/><path d="M7 45V58M14 45V58M21 45V58M28 45V58M35 45V58"/>
