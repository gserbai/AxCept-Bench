    <rect x="846" y="457" width="192" height="98" rx="14" fill="#11182a" stroke="#526985" stroke-width="2"/>
    <rect x="847" y="458" width="190" height="96" rx="13" fill="none" stroke="#ffba62" stroke-width="2" opacity="0">
